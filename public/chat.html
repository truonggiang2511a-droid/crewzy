<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trợ lý AI · Crewzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/layout.js"></script>
<script src="assets/auth.js"></script>
</head>
<body>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #FAFAFA; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1A1A1A">

<nav aria-label="Điều hướng chính" data-sidebar></nav>

<main data-chat-main="" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 20px 24px 76px; display: flex; flex-direction: column; gap: 14px; height: 100vh; height: 100dvh; max-width: 1000px">

<div style="display: flex; flex-direction: column; gap: 10px">
<div class="chat-head" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Trợ lý AI</h1>
<p class="chat-intro" style="margin: 4px 0 0; font-size: 14px; color: #4A4A4A">Ra lệnh bằng tiếng Việt. AI dùng các ứng dụng bạn đã <a href="ket-noi.html">kết nối</a> để làm việc. Việc đăng bài, gửi tin, chi tiền luôn hỏi bạn trước.</p>
</div>
<button type="button" data-chat-clear="" style="min-height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid #D6D6D6; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Cuộc trò chuyện mới</button>
</div>
<div class="chat-ai" style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; padding: 12px; background: #FFFFFF; border: 1px solid #E8E8E8; border-radius: 8px">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 200px">
<label for="ai-mode" style="font-size: 12px; font-weight: 600; color: #4A4A4A">AI đang dùng</label>
<select id="ai-mode" style="min-height: 40px; padding: 0 10px; border: 1px solid #D6D6D6; border-radius: 6px; font-family: inherit; font-size: 14px; background: #FFFFFF; color: #1A1A1A">
<option value="app">Credit của app (dùng thử)</option>
<option value="claude">Claude · khoá API riêng</option>
<option value="openai">ChatGPT · khoá API riêng</option>
<option value="gemini">Gemini · khoá API riêng</option>
<option value="grok">Grok · khoá API riêng</option>
<option value="openrouter">OpenRouter · đăng nhập tài khoản</option>
</select>
</div>
<div data-key-box="" style="display: none; flex: 1; min-width: 220px; flex-direction: column; gap: 4px">
<label for="ai-key" style="font-size: 12px; font-weight: 600; color: #4A4A4A">Khoá API</label>
<input id="ai-key" type="password" autocomplete="off" placeholder="Dán khoá API của bạn" style="min-height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid #D6D6D6; border-radius: 6px; font-family: inherit; font-size: 14px">
</div>
<div data-or-box="" style="display: none; flex: 1; min-width: 220px; flex-direction: column; gap: 4px">
<label for="or-model" data-or-model-label="" style="font-size: 12px; font-weight: 600; color: #4A4A4A">Model</label>
<select id="or-model" style="min-height: 40px; padding: 0 10px; border: 1px solid #D6D6D6; border-radius: 6px; font-family: inherit; font-size: 14px; background: #FFFFFF; color: #1A1A1A">
<option value="anthropic/claude-sonnet-5.5">Claude Sonnet 5.5 (giỏi, mặc định)</option>
<option value="anthropic/claude-haiku-5.5">Claude Haiku 5.5 (nhanh, rẻ)</option>
<option value="google/gemini-4-neon">Gemini 4 Neon (nhanh)</option>
</select>
<button type="button" data-or-login="" style="display: none; min-height: 40px; padding: 0 14px; border-radius: 6px; border: 0; background: var(--accent); color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Đăng nhập OpenRouter</button>
</div>
<p data-mode-note="" style="margin: 0; flex-basis: 100%; font-size: 12px; color: #6B6B6B">Dùng thử bằng credit của app, có giới hạn lượt mỗi ngày.</p>
</div>
</div>

<div id="chat-log" role="log" aria-live="polite" aria-label="Cuộc trò chuyện" style="flex: 1; min-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #FFFFFF; border: 1px solid #E8E8E8; border-radius: 8px"></div>

<div data-suggest="" style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" data-suggest-text="Làm 1 ảnh quảng cáo dọc 4:5 cho sản phẩm chính trong Brain thương hiệu, chưa đăng" style="min-height: 40px; padding: 0 12px; border-radius: 99px; border: 1px solid #D6D6D6; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 13px; cursor: pointer">Làm ảnh quảng cáo</button>
<button type="button" data-suggest-text="Làm 1 video dọc 9:16 dài 6 giây giới thiệu sản phẩm chính trong Brain thương hiệu: tạo ảnh sản phẩm trước rồi làm ảnh chuyển động, viết kèm caption, nộp vào Việc chờ duyệt" style="min-height: 40px; padding: 0 12px; border-radius: 99px; border: 1px solid #D6D6D6; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 13px; cursor: pointer">Làm video ngắn</button>
<button type="button" data-suggest-text="Liệt kê các Fanpage em đang quản lý được" style="min-height: 40px; padding: 0 12px; border-radius: 99px; border: 1px solid #D6D6D6; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 13px; cursor: pointer">Liệt kê các Fanpage</button>
<button type="button" data-suggest-text="Em đang kết nối được những ứng dụng nào của anh/chị?" style="min-height: 40px; padding: 0 12px; border-radius: 99px; border: 1px solid #D6D6D6; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 13px; cursor: pointer">Đã kết nối những gì?</button>
<button type="button" data-suggest-text="Đọc 10 dòng đầu trong Google Sheet khách hàng của tôi" style="min-height: 40px; padding: 0 12px; border-radius: 99px; border: 1px solid #D6D6D6; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 13px; cursor: pointer">Đọc Google Sheet</button>
<button type="button" data-suggest-text="Xem lịch hẹn tuần này trên Google Calendar" style="min-height: 40px; padding: 0 12px; border-radius: 99px; border: 1px solid #D6D6D6; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 13px; cursor: pointer">Lịch tuần này</button>
<button type="button" data-suggest-text="Soạn giúp tôi 1 bài đăng Facebook giới thiệu sản phẩm, chưa đăng, cho tôi xem trước" style="min-height: 40px; padding: 0 12px; border-radius: 99px; border: 1px solid #D6D6D6; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 13px; cursor: pointer">Soạn bài đăng</button>
</div>

<form data-chat-form="" style="display: flex; gap: 8px; align-items: flex-end">
<label for="chat-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tin nhắn cho Trợ lý AI</label>
<textarea id="chat-input" rows="2" placeholder="Ví dụ: Đăng bài này lên Fanpage lúc 8 giờ tối nay…" style="flex: 1; min-height: 48px; max-height: 160px; box-sizing: border-box; padding: 12px; border: 1px solid #D6D6D6; border-radius: 8px; font-family: inherit; font-size: 15px; resize: vertical; color: #1A1A1A"></textarea>
<button type="submit" data-chat-send="" style="min-height: 48px; padding: 0 20px; border-radius: 8px; border: 0; background: var(--accent); color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Gửi</button>
</form>

</main>
</div>
<script src="assets/openrouter.js"></script>
<script src="assets/chat.js"></script>
</body>
</html>
